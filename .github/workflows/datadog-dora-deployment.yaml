# GitHub Actions Workflow for Datadog DORA Deployment
#
# It sends a deployment event to Datadog DORA Metrics, for a service whose deployments Datadog does
# not detect by itself, as it does through APM Deployment Tracking. It runs as a job of its own: a
# job that has to time its own deployment uses the action `datadog-dora-deployment` as a step
# instead, which this workflow runs too.
#
# - Documentation: https://docs.datadoghq.com/delivery_performance/dora_metrics/setup/
# - API: https://docs.datadoghq.com/api/latest/delivery-performance/send-a-deployment-event/

name: "Datadog DORA Deployment"

on:
  workflow_call:
    inputs:
      service:
        type: string
        required: true
        description: Name of the Deployed Service, as in the Datadog Software Catalog
      deploy_env:
        type: string
        required: true
        description: Deployment Environment, such as `prod` or `stg`
      vcs_revision_id:
        type: string
        required: false
        default: ${{ github.sha }}
        description: VCS Revision ID (Git Commit SHA) of the Deployed Changes
      vcs_repository_url:
        type: string
        required: false
        default: ${{ github.server_url }}/${{ github.repository }}
        description: VCS Repository URL
      version:
        type: string
        required: false
        description: >-
          Version of the deployed service, which correlates the deployment with APM Deployment
          Tracking. It defaults to the VCS revision ID.
      deployment_started_at:
        type: string
        required: false
        description: >-
          Unix timestamp when the deployment started, in nanoseconds, milliseconds or seconds. It
          must be given together with `deployment_finished_at`. When neither is given, the
          deployment is timed as if it had happened while this workflow runs.
      deployment_finished_at:
        type: string
        required: false
        description: >-
          Unix timestamp when the deployment finished, in the same unit as `deployment_started_at`.
      team:
        type: string
        required: false
        description: >-
          Team owning the deployed service. When not given, Datadog takes it from the service's
          entry in the Software Catalog.
      custom_tags:
        type: string
        required: false
        description: >-
          Additional tags of the deployment event, in the form `key:value`, one per line. They are
          added to the tags that identify the GitHub Actions workflow run.
      datadog_site:
        type: string
        required: false
        default: datadoghq.com
        description: Datadog Site, such as `datadoghq.com` or `us5.datadoghq.com`
    secrets:
      datadog_api_key:
        required: true
        description: Datadog API Key
    outputs:
      deployment_id:
        description: ID of the DORA Deployment Event in Datadog
        value: ${{ jobs.main.outputs.deployment_id }}

permissions: {}

jobs:
  main:
    name: Main
    runs-on: ubuntu-22.04

    outputs:
      deployment_id: ${{ steps.send_deployment_event.outputs.deployment_id }}

    steps:
      # The action is taken from `master`, the branch callers take this workflow from, because a
      # reusable workflow cannot refer to an action of its own VCS repository at its own revision.
      - name: Send Deployment Event
        id: send_deployment_event
        uses: cordada/github-actions-utils/.github/actions/datadog-dora-deployment@master
        with:
          service: ${{ inputs.service }}
          deploy_env: ${{ inputs.deploy_env }}
          vcs_revision_id: ${{ inputs.vcs_revision_id }}
          vcs_repository_url: ${{ inputs.vcs_repository_url }}
          version: ${{ inputs.version }}
          deployment_started_at: ${{ inputs.deployment_started_at }}
          deployment_finished_at: ${{ inputs.deployment_finished_at }}
          team: ${{ inputs.team }}
          custom_tags: ${{ inputs.custom_tags }}
          datadog_site: ${{ inputs.datadog_site }}
          datadog_api_key: ${{ secrets.datadog_api_key }}
