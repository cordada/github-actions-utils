# GitHub Actions Workflow for 'Release and Publish' Task
#
# It opens a GitHub pull request to publish a release. Called from a merged release pull request, it
# derives the title, head VCS reference and assignee of its own from it. Called otherwise, as from a
# manually dispatched workflow, it publishes the VCS reference it runs on, with the changes as the
# description, and assigns whoever started it, or ends quietly when there is nothing to publish.

name: "Task: Release and Publish"

on:
  workflow_call:
    inputs:
      release_vcs_ref:
        type: string
        required: false
        default: refs/heads/master
        description: VCS Reference the Publication Pull Request Will Be Merged Into
      github_pull_request_labels:
        type: string
        required: false
        default: |-
          task
          kind: publish
        description: Labels of the GitHub Pull Request, One per Line
      request_reviews_from_change_authors:
        type: boolean
        required: false
        default: true
        description: >-
          Whether to request a review of the GitHub pull request from every GitHub user who
          authored one of the commits included in it.

      pre_publication_checklist_items:
        type: string
        required: false
        description: >-
          Repository-specific items of the pre-publication checklist, in Markdown. They are added
          after the items that are common to every repository. An item must not be hard-wrapped,
          because GitHub renders every newline of a comment as a line break. The checklist is
          commented on the GitHub pull request only when this input or
          `post_publication_checklist_items` is given.
      post_publication_checklist_items:
        type: string
        required: false
        description: >-
          Repository-specific items of the post-publication checklist, in Markdown. They are added
          before the items that are common to every repository. An item must not be hard-wrapped,
          because GitHub renders every newline of a comment as a line break. The checklist is
          commented on the GitHub pull request only when this input or
          `pre_publication_checklist_items` is given.

permissions: {}

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-22.04

    permissions:
      contents: write
      pull-requests: write

    env:
      CREATE_RELEASE_VCS_REVISION_ID: ${{ github.sha }} # Merge commit or head of manual run's ref.
      PREPARE_RELEASE_GITHUB_PULL_REQUEST_HTML_URL: ${{ github.event.pull_request.html_url }}
      PREPARE_RELEASE_GITHUB_PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
      PREPARE_RELEASE_GITHUB_VCS_REF: ${{ github.event.pull_request.head.ref }}
      PREPARE_RELEASE_GITHUB_PULL_REQUEST_ASSIGNEE: ${{ github.event.pull_request.assignee.login }}
      RELEASE_VCS_REF: ${{ inputs.release_vcs_ref }}

    steps:
      - name: Check Out VCS Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CREATE_RELEASE_VCS_REVISION_ID }}
          fetch-depth: ${{ github.event.pull_request && 1 || 0 }} # Full history for manual runs.

      - name: Prepare Git
        run: |
          echo 'Adding Git aliases…'
          git config alias.publish \
            'push --set-upstream origin HEAD'
          git config alias.lg-github-pr-summary \
            '!f() { git log --date=short --reverse --merges --grep="^Merge pull request #[[:digit:]]* from " --grep=" (#[[:digit:]]*)$" --pretty="tformat:- (%C(auto,red)<S>%s</S>%C(reset), %C(auto,green)%ad%C(reset)) %b" "$@" | grep -E "^- \(<S>.*</S>, .*\)" | sed -E -e "s|<S>Merge pull request (#[0-9]+) from .+</S>|PR \1|" -e "s|\(<S>(.+) \((#[0-9]+)\)</S>, ([0-9-]+)\).*$|(PR \2, \3) \1|"; }; f'

      - name: Check for Changes to Publish
        id: check_changes
        run: |
          # A merged release pull request always has something to publish, so it is not checked,
          # which keeps the publication of a release independent of the history of the release VCS
          # reference.
          if [ -n "$PREPARE_RELEASE_GITHUB_PULL_REQUEST_HTML_URL" ]; then
            echo 'Called from a merged release pull request. There are changes to publish.'
            echo 'has_changes=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Fetching release VCS reference '$RELEASE_VCS_REF'…"
          git fetch --verbose origin "$RELEASE_VCS_REF":"$RELEASE_VCS_REF"

          echo "Counting commits of '$CREATE_RELEASE_VCS_REVISION_ID' that are not in '$RELEASE_VCS_REF'…"
          change_count="$(git rev-list --count "${RELEASE_VCS_REF}..${CREATE_RELEASE_VCS_REVISION_ID}" --)"
          echo "change_count=${change_count:?}" >> "$GITHUB_OUTPUT"

          if [ "${change_count:?}" -gt 0 ]; then
            echo "There are $change_count changes to publish."
            echo 'has_changes=true' >> "$GITHUB_OUTPUT"
          else
            echo 'There is nothing to publish. The remaining steps will be skipped.'
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Pull Request for Publication
        if: ${{ steps.check_changes.outputs.has_changes == 'true' }}
        run: |
          # The values derived from the release pull request are handed to the later steps in files
          # rather than in $GITHUB_ENV, where a newline in one of them would define a variable.
          publication_dir_path="${RUNNER_TEMP:?}/publication"
          mkdir -p "$publication_dir_path"
          description_file_path="$publication_dir_path/description.md"

          if [ -n "$PREPARE_RELEASE_GITHUB_PULL_REQUEST_HTML_URL" ]; then
            create_release_vcs_branch_name="${PREPARE_RELEASE_GITHUB_VCS_REF:?}"
            create_release_vcs_branch_name="${create_release_vcs_branch_name/release/publish}"

            create_release_github_pull_request_title="${PREPARE_RELEASE_GITHUB_PULL_REQUEST_TITLE:?}"
            create_release_github_pull_request_title="publish ${create_release_github_pull_request_title,,}"
            create_release_github_pull_request_title="${create_release_github_pull_request_title@u}"

            printf 'Ref: %s' "${PREPARE_RELEASE_GITHUB_PULL_REQUEST_HTML_URL:?}" > "$description_file_path"

            release_assignee="$PREPARE_RELEASE_GITHUB_PULL_REQUEST_ASSIGNEE"
          else
            create_release_vcs_branch_name="publish/$(date -u +'%Y-%m-%dT%H%MZ')"
            create_release_github_pull_request_title='Release and publish'

            release_assignee="${GITHUB_ACTOR:?}"

            echo "## Changes

          $(git lg-github-pr-summary "${RELEASE_VCS_REF}..${CREATE_RELEASE_VCS_REVISION_ID}" --)
          " > "$description_file_path"
          fi

          echo "Creating release creation VCS branch '$create_release_vcs_branch_name'…"
          git checkout -b "${create_release_vcs_branch_name:?}" --
          git publish --verbose

          create_release_vcs_ref="refs/heads/${create_release_vcs_branch_name:?}"
          printf '%s' "${create_release_vcs_ref:?}" > "$publication_dir_path/vcs-ref"
          printf '%s' "${create_release_github_pull_request_title:?}" > "$publication_dir_path/title"
          printf '%s' "$release_assignee" > "$publication_dir_path/assignee"

      - name: Create GitHub Pull Request for Publication
        id: create_github_pull_request
        if: ${{ steps.check_changes.outputs.has_changes == 'true' }}
        run: |
          publication_dir_path="${RUNNER_TEMP:?}/publication"

          label_args=()
          while IFS= read -r label; do
            if [ -n "$label" ]; then
              label_args+=(--label "$label")
            fi
          done <<< "$GITHUB_PULL_REQUEST_LABELS"

          github_pull_request_url="$(
            gh pr create \
              --base "$RELEASE_VCS_REF" \
              --head "$(< "$publication_dir_path/vcs-ref")" \
              --draft \
              --title "$(< "$publication_dir_path/title")" \
              --body-file "$publication_dir_path/description.md" \
              --assignee "$(< "$publication_dir_path/assignee")" \
              "${label_args[@]}"
          )"

          echo "url=${github_pull_request_url:?}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_PULL_REQUEST_LABELS: ${{ inputs.github_pull_request_labels }}

      - name: Create Checklist
        if: >-
          ${{ steps.check_changes.outputs.has_changes == 'true'
          && (inputs.pre_publication_checklist_items != ''
          || inputs.post_publication_checklist_items != '') }}
        run: |
          checklist_file_path="${RUNNER_TEMP:?}/RELEASE_AND_PUBLICATION_CHECKLIST.md"

          # The here-document is unquoted so that the checklist item variables are expanded. Their
          # values are only substituted, never evaluated, so they cannot execute commands.
          cat > "$checklist_file_path" <<__EOF__
          > [!TIP]
          > 📎 It looks like you are trying to release and publish \
          a package 📦. Have you considered the following?

          # Release & Publication Checklist

          ## Pre-Publication Checklist

          - [ ] Was the **version** of the package raised for the changes being published?
          ${PRE_PUBLICATION_CHECKLIST_ITEMS}

          ## Post-Publication Checklist

          ${POST_PUBLICATION_CHECKLIST_ITEMS}
          - [ ] Publication finished successfully.
          __EOF__

          gh pr comment "$GITHUB_PULL_REQUEST_URL" --body-file "$checklist_file_path"
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_PULL_REQUEST_URL: ${{ steps.create_github_pull_request.outputs.url }}
          PRE_PUBLICATION_CHECKLIST_ITEMS: ${{ inputs.pre_publication_checklist_items }}
          POST_PUBLICATION_CHECKLIST_ITEMS: ${{ inputs.post_publication_checklist_items }}

      - name: Request Reviews from Change Authors
        id: request_reviews
        if: >-
          ${{ steps.check_changes.outputs.has_changes == 'true'
          && inputs.request_reviews_from_change_authors }}
        run: |
          github_pull_request_number="$(
            gh pr view "$GITHUB_PULL_REQUEST_URL" --json number --jq '.number'
          )"

          # The author of a commit is read from the GitHub API rather than from the Git history,
          # because only GitHub can resolve the email address of a commit to a GitHub user. The
          # commits are paginated, as a release easily exceeds the size of a single page.
          echo "Getting the authors of the commits of pull request #$github_pull_request_number…"
          commit_authors="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY:?}/pulls/${github_pull_request_number:?}/commits" \
              --jq '.[].author.login // empty' \
              | sort -u
          )"

          reviewers=()
          while IFS= read -r commit_author; do
            # A bot cannot be a reviewer, and neither can the pull request's own author, which is
            # the bot of GitHub Actions because the pull request is created with its token.
            case "$commit_author" in
              '' | *'[bot]') continue ;;
            esac
            reviewers+=("$commit_author")
          done <<< "$commit_authors"

          # A review is requested from one user at a time, because GitHub rejects the whole request
          # when a single one of the users cannot be a reviewer, for instance because they no longer
          # have access to the VCS repository. A review that cannot be requested is not fatal.
          requested_reviewers=()
          rejected_reviewers=()
          for reviewer in "${reviewers[@]}"; do
            echo "Requesting a review from '$reviewer'…"
            if gh pr edit "$GITHUB_PULL_REQUEST_URL" --add-reviewer "$reviewer"; then
              requested_reviewers+=("@$reviewer")
            else
              echo "::warning::Could not request a review from '$reviewer'."
              rejected_reviewers+=("@$reviewer")
            fi
          done

          {
            echo "requested_reviewers=${requested_reviewers[*]}"
            echo "rejected_reviewers=${rejected_reviewers[*]}"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_PULL_REQUEST_URL: ${{ steps.create_github_pull_request.outputs.url }}

      # No other step may write to $GITHUB_STEP_SUMMARY: GitHub renders each step's summary as a
      # Markdown document of its own and joins them with a blank line, which splits the list below.
      - name: Write Job Summary
        if: >-
          ${{ !cancelled()
          && (steps.create_github_pull_request.outcome == 'success'
          || steps.check_changes.outputs.has_changes == 'false') }}
        run: |
          {
            echo '# Release and Publish'
            echo

            if [ "$HAS_CHANGES" != 'true' ]; then
              echo 'Nothing to publish.'
              echo
              echo "- **From:** \`$CREATE_RELEASE_VCS_REVISION_ID\`"
              echo "- **Into:** \`$RELEASE_VCS_REF\`"
            else
              echo "$GITHUB_PULL_REQUEST_URL"
              echo

              if [ -n "$CHANGE_COUNT" ]; then
                echo "- **Changes:** $CHANGE_COUNT"
              fi

              echo "- **From:** \`$(< "${RUNNER_TEMP:?}/publication/vcs-ref")\`"
              echo "- **Into:** \`$RELEASE_VCS_REF\`"

              if [ -n "$PREPARE_RELEASE_GITHUB_PULL_REQUEST_HTML_URL" ]; then
                echo "- **Release:** $PREPARE_RELEASE_GITHUB_PULL_REQUEST_HTML_URL"
              fi

              if [ "$REQUEST_REVIEWS_FROM_CHANGE_AUTHORS" = 'true' ]; then
                echo "- **Reviewers:** ${REQUESTED_REVIEWERS:-Nobody}"
              fi

              if [ -n "$REJECTED_REVIEWERS" ]; then
                echo "- **Reviewers GitHub rejected:** $REJECTED_REVIEWERS"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          HAS_CHANGES: ${{ steps.check_changes.outputs.has_changes }}
          CHANGE_COUNT: ${{ steps.check_changes.outputs.change_count }}
          GITHUB_PULL_REQUEST_URL: ${{ steps.create_github_pull_request.outputs.url }}
          REQUEST_REVIEWS_FROM_CHANGE_AUTHORS: ${{ inputs.request_reviews_from_change_authors }}
          REQUESTED_REVIEWERS: ${{ steps.request_reviews.outputs.requested_reviewers }}
          REJECTED_REVIEWERS: ${{ steps.request_reviews.outputs.rejected_reviewers }}
